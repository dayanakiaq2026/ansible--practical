---
- name: Download Harbor Installer
  hosts: webservers
  become: yes

  tasks:
    - name: Install required packages
      dnf:
        name:
          - wget
          - tar
        state: present

    - name: Download Harbor
      get_url:
        url: https://github.com/goharbor/harbor/releases/download/v2.12.2/harbor-online-installer-v2.12.2.tgz
        dest: /tmp/harbor.tgz

    - name: Extract Harbor
      unarchive:
        src: /tmp/harbor.tgz
        dest: /opt
        remote_src: yes
